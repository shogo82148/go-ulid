on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.26"
          - "1.25"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: |
          go test -v ./...

  bench:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-arch:
          - "amd64"
          - "386"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
      - name: Run benchmarks
        env:
          GOARCH: ${{ matrix.go-arch }}
        run: |
          go test -bench=. -benchmem ./...
